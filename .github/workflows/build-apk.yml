name: Build Sileya Printer Bridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Android project files
        shell: bash
        run: |
          test -f settings.gradle || (echo "ERROR: settings.gradle tidak ditemukan. Upload isi project Android ke root repository." && exit 1)
          test -f build.gradle || (echo "ERROR: build.gradle tidak ditemukan. Upload isi project Android ke root repository." && exit 1)
          test -f app/build.gradle || (echo "ERROR: app/build.gradle tidak ditemukan. Upload folder app ke root repository." && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sileya-Printer-Bridge-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
